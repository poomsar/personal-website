{{ define "main" }}
<div class="photos">
  <div class="photos-head"><h1>Photos</h1><span>{{ len .Pages }} albums</span></div>
  <section class="covers">
    {{- range .Pages.ByWeight }}
    {{- $alb := index site.Data.albums .Params.album }}
    {{- $cover := index $alb.photos (sub (int $alb.cover) 1) }}
    <a class="cover" href="{{ .RelPermalink }}">
      <div class="im"><img src="/albums/{{ .Params.album }}/{{ $cover.thumb }}"
        srcset="/albums/{{ .Params.album }}/{{ $cover.thumb }} 600w, /albums/{{ .Params.album }}/{{ $cover.file }} 1600w"
        sizes="(max-width:760px) 100vw, 33vw" alt="{{ .Title }}" loading="lazy"></div>
      <div class="cap"><span class="t">{{ .Title }}</span><span class="y">{{ $alb.count }}</span></div>
    </a>
    {{- end }}
  </section>
</div>
{{ partial "footer.html" . }}
{{ end }}
